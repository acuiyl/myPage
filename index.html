<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #445066;

            flex-direction: column;
            /* 修改为列布局 */
            user-select: none;
        }

        table {
            border-collapse: collapse;
            width: 500px;
            max-width: 100%;
            background-color: #bad1d5;

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            border: 1px solid #ddd;
            text-align: center;
            padding: 10px;
        }

        td.active {
            background-color: #3d647270;
        }

        th {
            background-color: #3d6472;
            color: white;
        }

        input[type="time"] {
            width: 70px;
            margin-top: 5px;
            text-align: center;
            background-color: transparent;
            border: none;
        }


        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        caption {
            color: white;
            margin: 10px;
            font-size: larger;
        }

        #output {
            color: #c3e6ab;
        }
        .space{
          width: 10vw;
          height: 100%;
        }
        .container{
          display: flex;
          justify-content: space-between;
          padding: 10vw;
        }
        .toggle_button_container{
          text-align: right;
          width: 100%;
          padding: 2vw;
        }
        .toggle_button_container .toggle_button
        {
          font-weight: 700;
          border-radius: 5px;
          border:1px solid #bad1d5;
          background-color:#3d6472 ;
          color:  #ddd;
        }
        .hide { 
          display: none;
        }
    </style>
</head>

<body>
  <div class="toggle_button_container">
    <button class="toggle_button">切换单/双月</button>
  </div>
  <div class="container">

    <table id="calendar"></table>
    <div class="space"></div>
    <table id="calendar_1"></table>
  </div>

    <script>

        let mousedownFlag = false
        document.body.addEventListener('mousedown', () => {
            mousedownFlag = true
        })
        document.body.addEventListener('mouseup', () => {
            mousedownFlag = false
        })
        function calcTime(dateArray) {
            dateArray = dateArray.filter(Boolean) //去除空值
            dateArray = dateArray.filter(item => !!item)
            if (dateArray.length === 0) return 0; // 处理空数组情况

            let total = 0;
            for (const timeStr of dateArray) {
                const [hh, mm] = timeStr.split(':').map(Number);
                const timeInHours = hh + mm / 60;
                let diff = timeInHours - 9;
                if (timeInHours > 17.5) { // 超过17:30时额外减0.5小时
                    diff -= 0.5;
                }
                // 四舍五入到两位小数并累加
                total += Math.round(diff * 100) / 100;
            }
            const average = total / dateArray.length;
            const finalResult = Math.round((average - 1.5) * 100) / 100;
            return finalResult
        }

        function Calendar(year, month, storedData, parent) {
            this.year = year;
            this.month = month;
            this.storedData = storedData || {};
            this.parent = parent;
            this._init();
        }

        Calendar.prototype._init = function () {
            this.parent.innerHTML = '';
            let self = this;

            // 表头
            const caption = document.createElement('caption');
            caption.textContent = `${this.year}年${this.month}月 - `;
            const output = document.createElement('span')
            output.id = `output_${this.month}`
            caption.appendChild(output)
            this.parent.appendChild(caption);
            const thead = document.createElement('thead');
            const trHead = document.createElement('tr');
            const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            weekDays.forEach(day => {
                const th = document.createElement('th');
                th.textContent = day;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);
            this.parent.appendChild(thead);

            // 表体
            const tbody = document.createElement('tbody');

            const { daysInMonth, startDay } = this.getMonthData(year, month);
            let date = 1;
            let index = 1;
            for (let week = 0; week < 6; week++) { // 最多6周
                const tr = document.createElement('tr');
                for (let day = 0; day < 7; day++) {
                    const td = document.createElement('td');
                    td.addEventListener('mouseenter', () => {
                        if (mousedownFlag) {

                            td.classList.toggle('active')
                            let activeNode = document.querySelectorAll('.active')
                            let dateArray = []
                            activeNode.forEach(item => {
                                if (item.lastChild) {

                                    dateArray.push(item.lastChild.value)
                                }
                            })
                            console.log(calcTime(dateArray))


                        }
                    })
                    td.addEventListener('dblclick', () => {
                        td.classList.remove('active')
                    })

                    if (week === 0 && day < startDay || date > daysInMonth) {
                        // 空白单元格
                        tr.appendChild(td);
                    } else {
                        // 填充日期和输入框
                        const input = document.createElement('input');

                        input.type = 'time'; // 输入框类型改为 time
                        input.value = ''; // 默认为空
                        if (storedData[this.year][this.month] && storedData[this.year][this.month][index]) {
                            input.value = storedData[this.year][this.month][index]
                        }
                        input.dataset.index = index; // 存储索引信息
                        td.innerHTML = `<span>${date}</span><br>`;
                        td.appendChild(input);
                        date++;
                        index++;
                        tr.appendChild(td);
                        input.addEventListener('dblclick', (event) => {
                            event.stopPropagation()
                            input.value = '';
                        })

                        input.addEventListener('blur', () => {

                            // 更新保存的数据
                            const index = input.dataset.index;
                            if (!self.storedData[year]) {
                                self.storedData[year] = {};
                            }
                            if (!self.storedData[year][month]) {
                                self.storedData[year][month] = {};
                            }
                            self.storedData[self.year][self.month][index] = input.value;

                            // 保存到 LocalStorage
                            localStorage.setItem('calendarData', JSON.stringify(self.storedData));
                            this.calcTime()
                        });
                    }
                }
                tbody.appendChild(tr);
                if (date > daysInMonth) break; // 如果已经填充完所有日期，则退出循环
            }
            this.parent.appendChild(tbody);
            this.calcTime()

        }

        Calendar.prototype.getMonthData = function () {
            const firstDay = new Date(this.year, this.month - 1, 1);
            const lastDay = new Date(this.year, this.month, 0);
            return {
                daysInMonth: lastDay.getDate(),
                startDay: firstDay.getDay()
            };
        }

        Calendar.prototype.calcTime = function () {
            if (this.storedData[this.year][this.month]) {

                const dateArray = Object.values(this.storedData[this.year][this.month])
                const finalResult = calcTime(dateArray)
                document.querySelector(`#output_${this.month}`).innerHTML = `<span>${finalResult}</span>`
                return finalResult;
            } else {
                return 0
            }
        }

        Calendar.prototype.dispose = function () {

        }

        Calendar.prototype.savedData = function () {

        }

        // 获取当前日期
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth() + 1; // 月份从0开始
        const storedData = JSON.parse(localStorage.getItem('calendarData')) || { [year]: { [month]: {} } };
        let calendar = new Calendar(year, (month - 1), storedData, document.getElementById("calendar"));
        let calendar_1 = new Calendar(year, month, storedData, document.getElementById("calendar_1"));

        const space = document.querySelector('.space')
        const calendar_dom =  document.getElementById("calendar")
        const toggle_button = document.querySelector('.toggle_button')
        toggle_button.addEventListener('click',()=>{
          calendar_dom.classList.toggle('hide')
          space.classList.toggle('hide')
        })


    </script>
</body>

</html>
